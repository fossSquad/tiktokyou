# JVM settings for the Gradle daemon and the build.
#
# JDK 21 is required for the Java toolchain. Run Gradle with JAVA_HOME pointing
# at a JDK 21 install. If your JDK is not auto-detected, add a machine-local
# line below (do not commit machine paths) or run:
#   JAVA_HOME=/path/to/jdk21 ./gradlew <task>
# Machine-local toolchain paths can also be set in ~/.gradle/gradle.properties:
#   org.gradle.java.installations.paths=/path/to/jdk21
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
